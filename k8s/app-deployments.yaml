              value: "Server=mysql.microservices.svc.cluster.local;Port=3306;Database=payment_db;User=root;Password=rootpassword;"
            - name: RabbitMQ__Host
              value: "rabbitmq.microservices.svc.cluster.local"
          resources:
            requests:
              memory: "40Mi"
              cpu: "20m"
            limits:
              memory: "90Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: microservices
spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30002
