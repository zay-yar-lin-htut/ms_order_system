services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    deploy:
      resources:
        limits:
          memory: 200M

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command: >
      --innodb_buffer_pool_size=48M
      --performance_schema=OFF
      --max_connections=40
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 300M

  order-service:
    image: ghcr.io/zay-yar-lin-htut/order-service:latest
    container_name: order-service
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=order_db;User=root;Password=rootpassword;"
      RabbitMQ__Host: "rabbitmq"
    depends_on:
      - rabbitmq
      - mysql
    deploy:
      resources:
        limits:
          memory: 100M

  payment-service:
    image: ghcr.io/zay-yar-lin-htut/payment-service:latest
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=payment_db;User=root;Password=rootpassword;"
      RabbitMQ__Host: "rabbitmq"
    depends_on:
      - rabbitmq
      - mysql
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  mysql_data:
