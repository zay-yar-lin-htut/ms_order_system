name: Build and Deploy to K8s

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  # ========================================================
  # 1. CI Phase: Build & Push Images to GHCR
  # ========================================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push OrderService
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/OrderService/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/order-service:latest

      - name: Build & Push PaymentService
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/PaymentService/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/payment-service:latest

  # ========================================================
  # 2. CD Phase: Deploy to K3s (Kubernetes) on 1GB Server
  # ========================================================
  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy K8s manifests to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "k8s/app-deployments.yaml"
          target: "~/ProductSale"

      - name: SSH and Apply K8s Manifests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p ~/ProductSale/k8s

            # Create GHCR Image Pull Secret in microservices namespace so K8s can pull private images
            kubectl create namespace microservices --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret docker-registry ghcr-secret \
              --namespace=microservices \
              --docker-server=ghcr.io \
              --docker-username="${{ github.actor }}" \
              --docker-password="${{ secrets.GITHUB_TOKEN }}" \
              --dry-run=client -o yaml | kubectl apply -f -

            # Apply K8s Deployment and Services
            kubectl apply -f ~/ProductSale/k8s/app-deployments.yaml

            # Rollout restart to pull latest image
            kubectl rollout restart deployment/order-service -n microservices
            kubectl rollout restart deployment/payment-service -n microservices
